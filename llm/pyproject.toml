[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-medico-llm"
version = "0.1.0"
description = "Ingestão CONITEC PCDT (listagem em tabela) e dados tabulares (Einstein) para RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=0.6",
    "httpx>=0.27",
    "langchain-chroma>=0.1",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-text-splitters>=0.3",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "playwright>=1.41",
    "pymupdf4llm>=0.0.17",
    "pytest>=8.0",
    "ruff>=0.6",
    "tqdm>=4.67",
    "streamlit>=1.40",
    "rapidfuzz>=3.6",
    "spacy>=3.7",
    "medspacy>=1.2",
    "scispacy>=0.6.2",
]

[project.optional-dependencies]
semantic = [
    "langchain-experimental>=0.3",
]

[project.scripts]
download-pcdt = "pcdt_ingest.cli_pcdt:main"
download-clinical-exams = "pcdt_ingest.cli_exams:main"
extract-pcdt-markdown = "pcdt_ingest.cli_extract:main"
chunk-pcdt = "pcdt_ingest.cli_chunk:main"
build-conitec-catalog = "pcdt_ingest.cli_conitec_catalog:main"
build-vectorstore = "pcdt_ingest.cli_embed:main"
view-pcdt-chunks = "pcdt_ingest.cli_view_pcdt_chunks:main"
clean-pcdt-extracted = "pcdt_ingest.cli_clean:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
